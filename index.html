<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f9e3b">
<meta name="description" content="용인강남학교 진로직업부 진로·진학정보 안내 — 진학, 취업, 교육 및 훈련기관, 지역사회 유관시설, 복지서비스">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="진로진학정보">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>용인강남학교 진로·진학정보</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=Red+Hat+Display:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 2025 책자 디자인 그대로 — 표지 → 오각형 메뉴(복지 중심) → 목차 → 섹션 페이지(매달린 제목, 초록 물결, 보라 테두리 표).
   책자가 밝은 종이 한 가지라 라이트 단일 테마로 고정 */
:root{
  color-scheme:light;
  --bg:#ffffff; --paper:#f4f4f2; --ink:#1c1d1f; --muted:#5b5f57;
  --g-deep:#0e4a22; --g:#1f9e3b; --g-soft:#47a552; --lime:#8dc63f;
  --purple:#c25fd6; --navy:#0a47ad; --blue:#2b3be0;
  --tline:#4a2bd0; --th1:#cffbe1; --th2:#97b8fb;
  --note:#f7f6ee; --note-line:#a5a679; --olive:#6b7a2b;
  --peach:#fde9c9; --mint:#c9fff7; --lav:#cdd0ff; --leafbg:#e2f3d3;
  --kr:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --en:"Red Hat Display","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--kr);font-size:16px;line-height:1.6;word-break:keep-all;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:820px;margin:0 auto}

/* 상단 학교 띠 (모든 화면) */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);border-bottom:1px solid #e6e8e3}
.bar .inner{display:flex;align-items:center;gap:10px;padding-block:8px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);min-width:0}
.brand img{height:38px;width:auto;flex:none}
.brand b{font-weight:900;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.bar .sp{flex:1}
.iconbtn{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:14px;font-weight:700;color:var(--g-deep);padding:7px 11px;border-radius:99px;border:1.5px solid #cfe3cf;background:#fff}
.iconbtn svg{width:17px;height:17px}

/* 표지 */
.cover{position:relative;width:100%;max-width:600px;margin:0 auto;aspect-ratio:952/1233;container-type:inline-size;overflow:hidden;background:var(--paper)}
.cover .ring{position:absolute;border-radius:50%;border:5cqw solid rgba(0,0,0,.035)}
.cover .fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .ph1{clip-path:polygon(0 12.2%,4% 9.6%,52% 46.9%,25.2% 67.3%,0 67.3%);object-position:30% 50%}
.cover .gold{position:absolute;inset:0;background:rgba(240,196,60,.55);clip-path:polygon(21% 30.5%,52% 46.9%,48.5% 49.4%,16% 34%)}
.cover .tri{position:absolute;inset:0;background:linear-gradient(150deg,#46c050 0%,#1f9e3b 35%,#0b4a1f 100%);clip-path:polygon(0 50.3%,58.8% 100%,0 100%)}
.cover .tri2{position:absolute;inset:0;background:rgba(160,230,120,.35);clip-path:polygon(0 50.3%,2.2% 50.3%,24% 70%,0 58%)}
.cover .ph2w{position:absolute;inset:0;background:#fff;clip-path:polygon(40% 49.6%,88.6% 49.6%,100% 62.8%,100% 100%,55.4% 100%,26.6% 73.2%)}
.cover .ph2{clip-path:polygon(41.5% 50.7%,87.7% 50.7%,100% 64.1%,100% 100%,56.7% 100%,28.4% 73%);object-position:50% 70%}
.cover .leaves{position:absolute;left:55%;top:43%;width:45%;pointer-events:none}
.cover .logo{position:absolute;right:13.5%;top:6%;display:flex;align-items:center;gap:1.3cqw}
.cover .logo img{height:5.2cqw}
.cover .logo span{font-weight:700;font-size:4.1cqw;color:#111;letter-spacing:-.02em}
.cover h1{position:absolute;right:13.5%;top:13.2%;margin:0;text-align:right;font-weight:900;letter-spacing:-.03em;line-height:1.05}
.cover h1 .a{display:block;font-size:8.1cqw;color:var(--g-deep)}
.cover h1 .b{display:block;font-size:12.6cqw;color:var(--g);margin-top:1cqw}
.cover .en{position:absolute;right:13.5%;top:32%;font-family:var(--en);font-weight:500;font-size:2.8cqw;color:var(--g-deep)}
.cover .sig{position:absolute;right:13.5%;top:35.2%;font-family:var(--en);font-weight:500;font-size:2.1cqw;color:var(--paper);user-select:text;cursor:text}
.cover .sig::selection{background:var(--g);color:#fff}
.cover .pill{position:absolute;left:6.3%;top:80.3%;width:46%;height:7.4%;display:flex;align-items:center}
.cover .pill .globe{position:absolute;left:0;top:50%;transform:translateY(-50%);width:10.2cqw;height:10.2cqw;border-radius:50%;background:#56ad5c;border:.7cqw solid #e8f3e6;display:grid;place-items:center;z-index:1;box-shadow:0 0 0 .4cqw #3f9946}
.cover .pill .globe svg{width:6cqw;height:6cqw}
.cover .pill .txt{margin-left:5cqw;flex:1;height:100%;border-radius:99px;background:linear-gradient(180deg,#f7f7f7,#e2e2e2);border:.6cqw solid #3f9e46;border-left:0;padding-left:7.5cqw;display:flex;flex-direction:column;justify-content:center;line-height:1.25}
.cover .pill b{font-size:2.3cqw;font-weight:900}
.cover .pill span{font-family:var(--en);font-size:2.2cqw}
.cover .pub{position:absolute;left:7.9%;bottom:2.4%;color:#fff;font-size:1.6cqw;font-weight:500}

/* 오각형 메뉴 */
.hub{padding-block:34px 10px;text-align:center}
.hub h2{margin:0;font-weight:900;font-size:clamp(22px,5.6vw,30px);color:var(--g-deep);letter-spacing:-.02em;text-wrap:balance}
.hub p{margin:6px auto 0;color:var(--muted);font-size:15px;max-width:30em}
.penta{display:block;width:100%;max-width:470px;margin:14px auto 0;overflow:visible}
.penta a{cursor:pointer}
.penta .seg{stroke:#fff;stroke-width:5;stroke-linejoin:round;transition:filter .15s}
.penta a:hover .seg,.penta a:focus .seg{filter:brightness(.92)}
.penta a:focus{outline:none}
.penta a:focus-visible .seg{stroke:var(--navy);stroke-width:5}
.penta text{font-family:var(--kr);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.penta .lb{font-weight:900;font-size:19px;fill:#1c1d1f}
.penta .nb{font-family:var(--en);font-weight:700;font-size:12px;fill:var(--olive)}
.penta .hint{font-size:11.5px;fill:#3d4038;font-weight:500}
.penta .ctr{font-weight:900;font-size:19px;fill:#fff}
.penta .ctr2{font-size:10.5px;fill:#e5f7df;font-weight:500}
.cta{display:grid;gap:10px;margin:22px auto 0;max-width:520px}
.cta a{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;padding:16px 20px;border-radius:20px;font-weight:900;font-size:17px;text-align:left}
.cta .q{background:var(--g);color:#fff}
.cta .m{background:#fff;color:var(--g-deep);border:2px solid var(--g)}
.cta small{display:block;font-weight:500;font-size:13px;opacity:.85;margin-top:2px}

/* 목차 */
.toc{display:grid;grid-template-columns:auto 1fr;gap:10px 34px;padding-block:40px;max-width:720px;margin:0 auto}
.toc .vt{writing-mode:vertical-rl;font-weight:900;font-size:clamp(40px,9vw,72px);color:var(--olive);letter-spacing:-.04em;line-height:1;transform:rotate(180deg);text-align:right}
.toc ol{list-style:none;margin:0;padding:0;min-width:0}
.toc li a{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;padding:16px 0 14px;border-bottom:1.5px solid var(--olive);text-decoration:none}
.toc li b{font-weight:900;font-size:20px;color:var(--olive)}
.toc li span{grid-column:1;font-size:14.5px;color:#222}
.toc li em{grid-row:1/3;grid-column:2;font-style:normal;font-family:var(--en);font-weight:700;font-size:52px;color:var(--olive);line-height:1}
@media (max-width:520px){.toc{grid-template-columns:1fr}.toc .vt{writing-mode:horizontal-tb;transform:none;text-align:left;font-size:30px}}

/* 마지막 장 */
.end{background:#f7f7f7;padding-block:44px 52px;text-align:center}
.end img{width:150px;height:auto}
.end .mot{font-family:var(--en);font-size:19px;margin-top:6px}
.share{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:28px;text-align:left}
.share .qrbox{background:#fff;padding:10px;border-radius:12px;border:1px solid #ddd}
.share p{margin:0;max-width:16em;font-size:14px;color:var(--muted)}
.share b{color:var(--ink);display:block;font-size:15px}
.end .pub{font-size:13px;color:var(--muted);margin-top:26px}

/* 섹션 페이지 */
.page{position:relative;overflow:hidden;padding-bottom:20px}
.wave-tl{position:absolute;left:0;top:0;width:clamp(130px,30vw,290px);height:auto;pointer-events:none}
.wave-br{display:block;width:clamp(150px,34vw,300px);height:auto;margin-left:auto;margin-top:24px}
.hang{position:relative;display:flex;justify-content:center;padding-top:44px;margin-bottom:30px;z-index:1}
.hang .p{position:relative;background:#fff;border:4px solid var(--navy);border-radius:24px;padding:16px 34px;font-weight:900;font-size:clamp(22px,5.4vw,28px);color:var(--purple);letter-spacing:-.02em;text-align:center;max-width:92%}
.hang .p::before,.hang .p::after{content:"";position:absolute;top:-48px;width:1.5px;height:48px;background:#111}
.hang .p::before{left:12%}.hang .p::after{right:12%}
.hang .d{position:absolute;top:-5px;width:9px;height:9px;border-radius:50%;background:#111}
.content{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);gap:34px}
[hidden]{display:none!important}
.blk{scroll-margin-top:70px;min-width:0}
.blk-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;margin:0 0 10px}
.blk-h h3{margin:0;font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;gap:9px;align-items:baseline}
.blk-h h3::before{content:"";width:7px;height:7px;border-radius:50%;background:#111;flex:none;transform:translateY(-3px)}
.blk-h .meta{font-size:13.5px;color:#333}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums;background:#fff}
th,td{border:1.5px solid var(--tline);padding:10px 10px;text-align:center;vertical-align:middle}
th{background:linear-gradient(90deg,var(--th1),var(--th2));font-weight:700;color:#111}
td.l{text-align:left}
td b{font-weight:700}
.wide table{min-width:600px}
.tnote{font-size:13px;color:var(--muted);margin:8px 2px 0}
.note{background:var(--note);border:2px solid var(--note-line);border-radius:20px;padding:16px 20px 16px 18px}
.note ul{margin:0;padding-left:1.15em}
.note li+li{margin-top:5px}
.note .org{color:var(--blue);margin:0 0 6px;font-weight:500}
.note .nstar{color:var(--blue);margin:8px 0 0}
.go{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-weight:700;font-size:14.5px;text-decoration:none;color:var(--navy);padding:7px 14px;border:1.5px solid var(--navy);border-radius:99px;background:#fff}
.qr{display:none}
@media (min-width:760px){.qr{display:block;margin:8px auto 2px}}
.qrcell{display:flex;flex-direction:column;align-items:center;gap:2px}
.qrcell .u{font-family:var(--en);font-weight:700;font-size:13px;color:#222}
.qrcell .go{margin-top:0}

/* 파이 */
.pie{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:18px;align-items:center;border:1.5px solid #888;padding:18px;margin-top:16px;background:#fff}
.pie h4{grid-column:1/-1;margin:0;text-align:center;font-size:18px;font-weight:900}
.pie svg{width:100%;height:auto}
.pie ul{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:14px}
.pie li{display:flex;gap:8px;align-items:center}
.pie li i{width:11px;height:11px;flex:none}
.pie li b{margin-left:auto;font-variant-numeric:tabular-nums}
@media (max-width:480px){.pie{grid-template-columns:1fr}.pie svg{max-width:220px;margin:0 auto}}
.rate{text-align:center;padding:14px;border:1.5px solid var(--tline);border-top:0;background:#fff}
.rate b{font-size:20px;color:var(--g)}

/* 진학/지역사회 생활 유형 트리 */
.tree{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center;background:#f2f2f2;padding:16px;border-radius:4px}
.tree .root{grid-row:1/span 9;align-self:center;border:2px solid #2a8be0;background:#fff;padding:14px 16px;font-weight:700;font-size:17px;text-align:center}
.tree .br{display:grid;grid-template-columns:minmax(84px,auto) 1fr;gap:8px 12px;align-items:center;position:relative}
.tree .mid{border:2px solid #2a8be0;background:#e3e9f7;padding:10px 12px;font-weight:700;text-align:center}
.tree .mid.cy{background:#c9fff7}
.tree .leaves{display:grid;gap:8px}
.tree .leaf{border:2px solid #2a8be0;background:#fff;padding:8px 12px;font-weight:700;text-align:center;font-size:15px}
.tree .leaf.cy{background:#c9fff7}
@media (max-width:520px){.tree{grid-template-columns:1fr}.tree .root{grid-row:auto}.tree .br{grid-template-columns:1fr;padding-left:14px;border-left:2px solid #2a8be0}}

/* 취업유형 */
.jt{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;align-items:center}
.jt .c{grid-column:span 2;border:2px solid #111;border-radius:22px;padding:16px 12px;text-align:center;min-width:0}
.jt .c em{display:block;font-style:normal;font-family:var(--en);font-weight:700;font-size:18px}
.jt .c b{display:block;font-weight:900;font-size:17px;margin:2px 0 6px}
.jt .c p{margin:0;font-size:13.5px;line-height:1.5}
.jt .ctr{grid-column:1/-1;text-align:center;font-weight:900;font-size:clamp(30px,7vw,44px);letter-spacing:-.03em;order:3}
.jt .c:nth-child(1){order:1}.jt .c:nth-child(2){order:2}.jt .c:nth-child(3){order:2}
.jt .c:nth-child(4){order:4;grid-column:2/span 2}.jt .c:nth-child(5){order:5}
.jt .c:nth-child(2){transform:translateY(-14px)}
@media (max-width:620px){.jt{grid-template-columns:1fr 1fr}.jt .c,.jt .c:nth-child(4){grid-column:auto;order:4;transform:none}.jt .ctr{order:0}.jt .c:nth-child(5){grid-column:1/-1}}

/* 재활시설 비교 카드 */
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1.5px solid var(--tline)}
.cmp>div{border-left:1.5px solid var(--tline);display:flex;flex-direction:column;min-width:0}
.cmp>div:first-child{border-left:0}
.cmp h4{margin:0;padding:12px;text-align:center;background:linear-gradient(90deg,var(--th1),var(--th2));font-weight:900;font-size:16.5px;border-bottom:1.5px solid var(--tline)}
.cmp ul{margin:0;padding:12px 12px 12px 26px;font-size:14px;flex:1}
.cmp .ft{border-top:1.5px solid var(--tline);padding:10px;text-align:center}
@media (max-width:700px){.cmp{grid-template-columns:1fr}.cmp>div{border-left:0;border-top:1.5px solid var(--tline)}.cmp>div:first-child{border-top:0}}

/* 구 필터, 전화 */
.flt{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.flt button{font:inherit;font-size:14px;font-weight:700;padding:6px 14px;border-radius:99px;border:1.5px solid var(--tline);background:#fff;color:var(--tline);cursor:pointer}
.flt button[aria-pressed="true"]{background:var(--tline);color:#fff}
.tel{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tel a{text-decoration:none;font-variant-numeric:tabular-nums;user-select:all}
.cp{font:inherit;font-size:11.5px;border:1px solid #bbb;background:#fafafa;color:#555;padding:1px 7px;border-radius:7px;cursor:pointer}
.cp.ok{border-color:var(--g);color:var(--g)}

/* 넘기기 */
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:40px;position:relative;z-index:1}
.pager a{flex:1;text-decoration:none;border:2px solid var(--g);border-radius:16px;padding:12px 16px;font-weight:900;color:var(--g-deep);font-size:16px}
.pager a small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.pager a.nx{text-align:right}

/* 찾기 */
.sbox{position:relative}
.sbox input{width:100%;font:inherit;font-size:17px;padding:15px 16px 15px 46px;border-radius:16px;border:2.5px solid var(--g);background:#fff;color:var(--ink)}
.sbox input::placeholder{color:#7b8076}
@media (max-width:440px){.sbox input{font-size:15px;padding-left:42px}}
.sbox svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:21px;height:21px;color:var(--g)}
.sug{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.sug button{font:inherit;font-size:14px;border:1px solid #cfd7c8;background:var(--note);border-radius:99px;padding:5px 12px;cursor:pointer;color:#333}
.mapwrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:center;margin-top:24px}
@media (max-width:640px){.mapwrap{grid-template-columns:minmax(0,1fr)}}
.map{width:100%;height:auto;display:block}
.map .d{cursor:pointer;stroke:#fff;stroke-width:2.5;stroke-linejoin:round;transition:fill .15s}
.map a:focus{outline:none}
.map a:focus-visible .d{stroke:var(--navy);stroke-width:3.5}
.map text{pointer-events:none;font-family:var(--kr)}
.map .gu{font-weight:900;font-size:16px;fill:#0b2f2a;text-anchor:middle}
.map .gu-en{font-family:var(--en);font-size:9px;fill:#0b2f2a;text-anchor:middle;font-weight:500}
.map .em{font-size:11px;fill:#123;text-anchor:middle;font-weight:500}
.map .em-en{font-family:var(--en);font-size:7.5px;fill:#234;text-anchor:middle}
.map a.on text{fill:#fff}
.side h3{margin:0 0 6px;font-size:18px;font-weight:900;color:var(--g-deep)}
.side p{margin:0 0 12px;font-size:14.5px;color:var(--muted)}
.res{margin-top:26px;display:grid;grid-template-columns:minmax(0,1fr);gap:26px}
.res h4{margin:0 0 8px;font-size:16.5px;font-weight:900;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.res h4 small{font-weight:500;font-size:13px;color:var(--muted)}
.res h4 a{font-size:13px;font-weight:700;color:var(--navy)}
.cnt{font-size:15px;font-weight:700;color:var(--g-deep)}
.info-hits{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.info-hits a{display:block;text-decoration:none;padding:12px 16px;border:2px solid var(--note-line);background:var(--note);border-radius:16px;font-weight:700}
.info-hits small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:12px 0}

/* 안내(관계) 페이지 */
.q-title{text-align:center;font-weight:900;font-size:clamp(26px,6.6vw,38px);letter-spacing:-.03em;color:var(--g-deep);margin:0 0 8px;text-wrap:balance}

.flow{display:grid;gap:12px;margin-top:26px}

.flow .arrow{justify-self:center;width:2px;height:22px;background:var(--g-deep);position:relative}
.flow .arrow::after{content:"";position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--g-deep);border-bottom:0}
.paths{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

.paths a{display:flex;flex-direction:column;gap:4px;text-decoration:none;border:2px solid #111;border-radius:20px;padding:14px 12px;text-align:center;min-width:0}
.paths a b{font-weight:900;font-size:17px}
.paths a span{font-size:13.5px;line-height:1.45}
.paths a i{font-style:normal;font-size:12.5px;font-weight:700;color:var(--navy);margin-top:auto;padding-top:6px}
.wel{display:block;text-decoration:none;background:linear-gradient(135deg,#2bab45,#0e4a22);color:#fff;border-radius:22px;padding:16px 20px;text-align:center}

.wel span{display:block;font-size:14px;opacity:.92;margin-top:2px}
.rel{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.rel li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--note);border:2px solid var(--note-line);border-radius:18px;padding:12px 16px}
.rel .ar{font-weight:900;color:var(--g);font-size:15px;white-space:nowrap;padding-top:1px}
.path{border:2px solid #111;border-radius:22px;overflow:hidden;background:#fff}
.path header{padding:14px 18px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.path header em{font-style:normal;font-family:var(--en);font-weight:700;color:var(--olive);font-size:18px}
.path header b{font-weight:900;font-size:20px}
.path header span{font-size:14px;color:#333}
.path dl{margin:0;padding:4px 18px 16px;display:grid;gap:10px}
.path dl div{display:grid;grid-template-columns:5.8em 1fr;gap:10px}
.path dt{font-weight:900;color:var(--g-deep);font-size:14.5px}
.path dd{margin:0;font-size:15px;min-width:0}
.path .go{margin:0 18px 16px}
@media (max-width:440px){.path dl div{grid-template-columns:1fr;gap:0}}
/* 첫 화면 */
.splash{display:flex;flex-direction:column;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--paper)}
.splash .cover{width:min(100%, calc((100dvh - 150px) * 952 / 1233));max-width:600px}
.start-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding-block:14px 22px;background:var(--paper)}
.start-btn{display:flex;align-items:center;gap:14px;justify-content:space-between;width:100%;max-width:460px;text-decoration:none;background:var(--g);color:#fff;font-weight:900;font-size:clamp(19px,5.2vw,23px);line-height:1.3;padding:16px 24px;border-radius:24px;box-shadow:0 6px 0 #0e4a22}
.start-btn span{font-size:26px}
.start-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #0e4a22}
/* 별 도표 */
.star-page{padding-bottom:30px;background:radial-gradient(120% 60% at 50% 40%,#eef8ea 0%,#fff 64%)}
.star-eye{margin:22px 0 0;text-align:center;font-size:12.5px;font-weight:700;letter-spacing:.12em;color:var(--g)}
.star-title{margin:4px 0 0;text-align:center;font-weight:900;font-size:clamp(27px,7.4vw,38px);color:var(--g-deep);letter-spacing:-.04em;text-wrap:balance}
.star-sub{margin:4px 0 0;text-align:center;color:var(--muted);font-size:15px}
.star{display:block;width:100%;max-width:500px;max-height:calc(100dvh - 310px);min-height:300px;margin:4px auto 0;overflow:visible}
.star a{cursor:pointer;outline:none}
.star .pt{transition:transform .25s cubic-bezier(.3,1.4,.5,1);animation:pop .5s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes pop{from{transform:scale(.95)}to{transform:none}}
.star .pt:hover,.star .pt:focus-visible{transform:translate(var(--dx,0),var(--dy,0))}
.star .ctr-a:hover,.star .ctr-a:focus-visible{transform:scale(1.03)}
.star .seg{stroke-linejoin:round;transition:filter .2s}
.star .pt:hover .seg,.star .pt:focus-visible .seg{filter:saturate(1.3) brightness(.97)}
.star text{font-family:var(--kr);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.star .lb{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:25.5px;letter-spacing:-.01em}
.star .ctr{font-weight:900;font-size:34px;fill:#fff;letter-spacing:-.04em}
.star .ctr2{font-weight:700;font-size:22px;fill:#e5f7df;letter-spacing:-.02em}
.star .ctr3{font-size:14.5px;fill:#fff;font-weight:700}
.star .ctr-go rect{fill:rgba(255,255,255,.2);stroke:rgba(255,255,255,.55);stroke-width:1.2}
.star .neon{fill:none;stroke:#00c8ff;stroke-linejoin:round}
.star .neon-in{fill:none;stroke:#fff;stroke-linejoin:round}
.star .neon-glow{fill:none;stroke:#00e5ff;stroke-linejoin:round;filter:url(#nglow);animation:neon 1.6s ease-in-out infinite}
@keyframes neon{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.star .neon-glow{animation:none}}
.star-hint{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0 0;font-size:14px;color:#4b5563;text-align:center}
.star-hint svg{width:16px;height:16px;fill:none;stroke:var(--navy);stroke-width:2.4;stroke-linecap:round;flex:none}
.star-test{display:flex;align-items:center;gap:14px;max-width:500px;margin:18px auto 0;text-decoration:none;padding:14px 18px;border-radius:22px;background:linear-gradient(120deg,#5b3cc4,#7b5ce0 55%,#9d7df0);color:#fff;box-shadow:0 10px 24px -10px rgba(74,42,158,.55)}
.star-test .ic{flex:none;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.star-test .ic svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.star-test .tx{flex:1;min-width:0}
.star-test b{display:block;font-weight:900;font-size:18px;letter-spacing:-.02em}
.star-test small{display:block;font-size:13px;opacity:.88;margin-top:2px}
.star-test .ar{font-size:22px;font-weight:700}
.star-test:hover{filter:brightness(1.05)}
.star-test.gd{background:linear-gradient(120deg,#2e8b3e,#47a552 55%,#6cc070);box-shadow:0 10px 24px -10px rgba(46,139,62,.55)}
.star-test.gd + .star-test,.star-test + .star-test.ex{margin-top:12px}
.star-test.ex{background:linear-gradient(120deg,#1d5fb8,#2f7fd8 55%,#56a3ec);box-shadow:0 10px 24px -10px rgba(29,95,184,.55)}
.star-test b,.star-test small{word-break:keep-all;text-wrap:balance}
.star-test.gd b{font-size:17px}
/* 성향 파악하기 */
.tests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:620px){.tests{grid-template-columns:minmax(0,1fr)}}
.tcard{display:flex;flex-direction:column;gap:14px;text-decoration:none;color:var(--ink);border-radius:26px;padding:22px;min-width:0;box-shadow:0 12px 28px -16px rgba(0,0,0,.35);transition:transform .2s}
.tcard:hover{transform:translateY(-3px)}
.tcard.t1{background:linear-gradient(150deg,#e3f5d9,#b9e3a3)}
.tcard.t2{background:linear-gradient(150deg,#efe8ff,#cbb8ff)}
.tcard .art{width:76px;height:76px;border-radius:22px;display:grid;place-items:center}
.tcard.t1 .art{background:#2f8f3f}
.tcard.t2 .art{background:#6a4bd1}
.tcard .art svg{width:56px;height:56px}
.tcard .tt{display:flex;flex-direction:column;gap:6px}
.tcard small{font-size:13px;font-weight:700;color:#3d4a3f;letter-spacing:.02em}
.tcard.t2 small{color:#4a3a84}
.tcard b{font-weight:900;font-size:22px;letter-spacing:-.03em;line-height:1.25}
.tcard .tt>span{font-size:15px;line-height:1.55;color:#2c3330}
.tcard i{font-style:normal;align-self:flex-start;margin-top:6px;font-weight:800;font-size:15px;padding:9px 16px;border-radius:99px;background:#fff}
.tcard.t1 i{color:#256c31}.tcard.t2 i{color:#4a2a9e}
.legend{list-style:none;margin:6px 4px 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13px;font-weight:700;color:#2b3330}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.legend b{font-weight:500;color:var(--muted)}
.miss{margin:6px 6px 0;font-size:12.5px;color:#7a5a00;background:#fff6dc;border-radius:10px;padding:6px 10px;text-align:center}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:1px;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px rgba(0,0,0,.18)}
.pcards .where{font-size:13px;color:#4b5563;margin-top:4px}
.pcards .where.nopos{color:#9a5b00}
.appfoot{border-top:1px solid #e6e8e3;background:#fff;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.appfoot .inner{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:12px;color:#7a8076}
.appfoot .sig2{font-family:var(--en);font-size:9.5px;color:#b3b8b0;letter-spacing:.02em;text-align:right}
.appfoot .sig{font-size:10px;color:#a3a89f;letter-spacing:.02em}
/* 조직도형 도표 */
.org{display:grid;gap:0;justify-items:center;background:linear-gradient(180deg,#f6faf4,#fff);border:1.5px solid #e2e9de;border-radius:22px;padding:22px 16px 18px}
.org-root small{display:block;margin-top:8px;font-size:13px;color:var(--g-deep);font-weight:600;word-break:keep-all;text-align:center}
.org-root span{display:inline-block;background:var(--g-deep);color:#fff;font-weight:900;font-size:18px;letter-spacing:-.02em;padding:10px 26px;border-radius:99px;box-shadow:0 6px 14px -8px rgba(14,74,34,.6)}
.org-row{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px;width:100%;margin-top:30px}
.org-row::before{content:"";position:absolute;top:-30px;left:50%;width:2px;height:15px;background:#9fbfa6;transform:translateX(-50%)}
.org-row::after{content:"";position:absolute;top:-15px;left:calc(100% / var(--n) / 2);right:calc(100% / var(--n) / 2);height:2px;background:#9fbfa6}
.org-b{position:relative;background:#fff;border-radius:18px;border:1.5px solid color-mix(in srgb,var(--fg) 30%,#fff);overflow:hidden;min-width:0;display:flex;flex-direction:column}
.org-b::before{content:"";position:absolute;top:-17px;left:50%;width:2px;height:16px;background:#9fbfa6;transform:translateX(-50%)}
.org-h{display:flex;gap:10px;align-items:center;background:var(--bg);padding:12px 14px}
.org-ic{flex:none;width:34px;height:34px;border-radius:11px;background:#fff;display:grid;place-items:center}
.org-ic svg{width:20px;height:20px;fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.org-h b{display:block;font-weight:900;font-size:16.5px;color:#1c1d1f;letter-spacing:-.02em;line-height:1.3}
.org-h small{display:block;font-size:12.5px;color:#5b5f57;margin-top:1px}
.org-b ul{list-style:none;margin:0;padding:12px;display:flex;flex-wrap:wrap;gap:6px}
.org-b li{font-size:13.5px;font-weight:700;color:var(--fg);background:var(--bg);border-radius:10px;padding:5px 10px;line-height:1.35}
.org-b.overflow{overflow:visible}
.hub{background:linear-gradient(180deg,#f4faf2,#fff);border:1.5px solid #e1ecdf;border-radius:22px;padding:18px 16px 16px}
.hub-root{text-align:center}
.hub-root span{display:inline-block;background:var(--g-deep);color:#fff;font-weight:900;font-size:17px;letter-spacing:-.02em;padding:9px 22px;border-radius:99px;box-shadow:0 6px 14px -8px rgba(14,74,34,.6)}
.hub-row{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;margin-top:16px}
.hub-g{background:#fff;border:1.5px solid color-mix(in srgb,var(--fg) 30%,#fff);border-radius:18px;overflow:hidden;min-width:0}
.hub .hub-gt{margin:0;text-align:left;padding:10px 14px;background:var(--bg);color:var(--fg);font-weight:900;font-size:14.5px;letter-spacing:-.01em}
.hub-g ul{list-style:none;margin:0;padding:10px;display:grid;gap:8px}
.hub-g a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:14px;background:var(--bg);text-decoration:none;color:#1c1d1f;border:1.5px solid transparent;transition:border-color .15s,transform .15s;min-width:0}
.hub-g a:hover,.hub-g a:focus-visible{border-color:var(--fg);transform:translateY(-1px)}
.hub-ic{flex:none;width:38px;height:38px;border-radius:11px;background:#fff;display:grid;place-items:center}
.hub-ic svg{width:21px;height:21px;fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hub-tx{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;line-height:1.35}

.hub-tx span{font-size:12.5px;color:#4b5049;word-break:keep-all}
.hub-g em{flex:none;font-style:normal;font-size:11px;font-weight:800;color:var(--fg);background:#fff;border:1px solid color-mix(in srgb,var(--fg) 40%,#fff);border-radius:99px;padding:2px 7px}

@media (max-width:640px){.hub-row{grid-template-columns:minmax(0,1fr)}.hub{padding:16px 12px 12px}.hub-g em{display:none}}
.org-b li.org-sub{flex:1 1 100%;background:#fff;padding:0;border:1.5px dashed color-mix(in srgb,var(--fg) 35%,#fff);border-radius:14px;color:inherit}
.org-sub .sg-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px 0;font-size:12.5px;font-weight:800;color:#5b5f57;letter-spacing:-.01em}
.org-sub .sg-h em{font-style:normal;font-size:11.5px;font-weight:800;color:#fff;background:#e53935;border-radius:99px;padding:2px 8px}
.org-b .org-sub ul{padding:8px 10px 10px}
.org-b.hot{border:2.5px solid #e53935;overflow:visible;animation:hotblink 1.3s ease-in-out infinite}
.org-b.hot .org-h{border-radius:16px 16px 0 0}
.agetag{display:inline-block;vertical-align:1px;margin-left:5px;font-style:normal;font-size:.78em;font-weight:800;color:#fff;background:#e53935;border-radius:99px;padding:1px 8px;letter-spacing:0}
.hot-tag{display:inline-block;vertical-align:2px;margin-left:6px;font-style:normal;font-size:11px;font-weight:800;color:#fff;background:#e53935;border-radius:99px;padding:2px 7px;letter-spacing:0}

@keyframes hotblink{0%,100%{border-color:#e53935;box-shadow:0 0 0 0 rgba(229,57,53,.45)}50%{border-color:rgba(229,57,53,.25);box-shadow:0 0 0 5px rgba(229,57,53,.12)}}
@media (prefers-reduced-motion:reduce){.org-sub.hot,.org-b.hot{animation:none}}
@media (max-width:620px){
  .org{padding:16px 8px 12px}

  .org-root small{font-size:11.5px}

}

@media (max-width:720px){.kwrap{grid-template-columns:minmax(0,1fr)}}

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = s => String(s).replace(/<[^>]+>/g,' ');
const GU = {'처인':'처인구','기흥':'기흥구','수지':'수지구'};

function qrSVG(url, size=92){
  const q = (window.QR||{})[url]; if(!q) return '';
  const [n,d] = q;
  return `<svg class="qr" width="${size}" height="${size}" viewBox="-1 -1 ${n+2} ${n+2}" role="img" aria-label="QR코드"><rect x="-1" y="-1" width="${n+2}" height="${n+2}" fill="#fff"/><path d="${d}" fill="#111"/></svg>`;
}
function linkCell(url, label='바로가기'){
  return `<div class="qrcell"><a class="go" href="${url}" target="_blank" rel="noopener">${label} ↗</a></div>`;
}
function telHTML(t){
  return t.split(' · ').map(n=>`<span class="tel"><a href="tel:${n.replace(/-/g,'')}">${n}</a><button class="cp" type="button" data-copy="${n}">복사</button></span>`).join('<br>');
}
function cell(c){
  if(typeof c==='string' && c.startsWith('@')) return linkCell(c.slice(1));
  return c;
}

function blockHead(b){
  if(!b.title || b.type==='jobtypes') return '';
  return `<div class="blk-h"><h3>${b.title}</h3>${b.meta?`<span class="meta">${b.meta}</span>`:''}</div>`;
}
function renderBlock(b){
  let h='';
  if(b.type==='stats'){
    const tot=b.items.reduce((a,x)=>a+x[1],0), soc=b.items.filter(x=>x[3]==='사회참여').reduce((a,x)=>a+x[1],0);
    const sc=b.items.filter(x=>x[3]==='사회참여').length;
    h=`<div class="tbl wide"><table><thead><tr><th colspan="${sc}">사회참여</th><th colspan="${b.items.length-sc}">기타</th></tr>
      <tr>${b.items.map(x=>`<th>${x[0]}</th>`).join('')}</tr></thead><tbody><tr>${b.items.map(x=>`<td>${x[1]}</td>`).join('')}</tr>
      <tr><td colspan="${b.items.length}">사회참여율(취업+진학) : <b>${Math.round(soc/tot*100)}%</b> (전체 ${tot}명 중 ${soc}명)</td></tr></tbody></table></div>`;
    let a0=-Math.PI/2, paths='';
    b.items.forEach(x=>{const a1=a0+x[1]/tot*Math.PI*2, r=90, cx=100, cy=100;
      const p=(a)=>`${(cx+r*Math.cos(a)).toFixed(2)} ${(cy+r*Math.sin(a)).toFixed(2)}`;
      paths+=`<path d="M${cx} ${cy}L${p(a0)}A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${p(a1)}Z" fill="${x[2]}" stroke="#fff" stroke-width="2.5"/>`;
      const m=(a0+a1)/2, lr=x[1]/tot>.08?58:104; const lx=cx+lr*Math.cos(m), ly=cy+lr*Math.sin(m);
      paths+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#111" font-family="sans-serif">${x[1]}</text>`;
      a0=a1;});
    h+=`<div class="pie"><h4>졸업생 진로 현황 유형(명)</h4><svg viewBox="-20 -20 240 240" role="img" aria-label="졸업생 진로 현황 원그래프">${paths}</svg>
      <ul>${b.items.map(x=>`<li><i style="background:${x[2]}"></i>${x[3]} ${x[0]}<b>${x[1]}</b></li>`).join('')}</ul></div>`;
  }
  if(b.type==='tree'){

function star(){
  const r=134, g=24, round=9;
  const rad=d=>d*Math.PI/180, P=(R,d)=>[R*Math.cos(rad(d)), R*Math.sin(rad(d))];
  const f=n=>n.toFixed(1);
  const V=[0,1,2,3,4,5].map(j=>P(r,60*j));            // 육각형 꼭짓점 (좌우가 뾰족)
  const a=r*Math.cos(rad(30)), half=(a+g)*Math.tan(rad(30))-7, h=half*Math.tan(rad(66));
  // k: 변 번호 (변 k = V[k]→V[k+1], 바깥 방향 60k+30°)
  const pts=[
    {k:4, href:'#bokji', l:['복지','서비스'], icon:'heart', c:['#f2fff0','#9be88f'], ink:'#0d5326', neon:true},
    {k:5, href:'#jinhak', l:['진학'], icon:'cap', c:['#f3eeff','#cbb8ff'], ink:'#4a2a9e'},
    {k:0, href:'#find', l:['검색'], icon:'find', c:['#eaf2ff','#a9c6ff'], ink:'#0a47ad'},
    {k:1, href:'#siseol', l:['미취업','유형'], icon:'home', c:['#e2fbf6','#93e0d3'], ink:'#0b6457'},
    {k:2, href:'#hullyeon', l:['교육 및','훈련기관'], icon:'book', c:['#eef8df','#c4e69a'], ink:'#356312'},
    {k:3, href:'#chwieop', l:['취업'], icon:'bag', c:['#fff3e1','#ffcf8f'], ink:'#8a4600'}
  ];
  let defs='', g1='', neon='';
  pts.forEach((p,i)=>{
    const nd=60*p.k+30, [nx,ny]=P(1,nd);
    const v1=V[p.k], v2=V[(p.k+1)%6];
    const tx=(v2[0]-v1[0])/r, ty=(v2[1]-v1[1])/r, inset=round*0.9, mid=P(a+g,nd);
    const b1=[mid[0]-tx*(half-inset), mid[1]-ty*(half-inset)], b2=[mid[0]+tx*(half-inset), mid[1]+ty*(half-inset)];
    const ap=P(a+g+h-round*1.6, nd), bm=P(a+g, nd);
    defs+=`<linearGradient id="pg${i}" gradientUnits="userSpaceOnUse" x1="${f(bm[0])}" y1="${f(bm[1])}" x2="${f(ap[0])}" y2="${f(ap[1])}"><stop offset="0" stop-color="${p.c[0]}"/><stop offset="1" stop-color="${p.c[1]}"/></linearGradient>`;
    const [cx,cy]=P(a+g+h*0.35, nd), lh=27, bh=42+6+p.l.length*lh, top=cy-bh/2;
    const ix=cx, iy=top+21, ly=top+42+6+lh/2;
    let t=`<g class="badge" transform="translate(${f(ix)} ${f(iy)})"><circle r="21" fill="#fff"/><g transform="translate(-13.2 -13.2) scale(1.1)" fill="none" stroke="${p.ink}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[p.icon]}</g></g>`;
    let y=ly;
    p.l.forEach(l=>{t+=`<text class="lb" x="${f(cx)}" y="${f(y)}" fill="${p.ink}">${l}</text>`; y+=lh;});
    const d=`M${f(b1[0])} ${f(b1[1])}L${f(ap[0])} ${f(ap[1])}L${f(b2[0])} ${f(b2[1])}Z`;
    const glow=p.neon?`<path class="neon-glow" d="${d}" stroke-width="${round*2+26}"/><path class="neon" d="${d}" stroke-width="${round*2+12}"/><path class="neon-in" d="${d}" stroke-width="${round*2+4}"/>`:'';
    g1+=`<a class="pt${p.neon?' pt-neon':''}" href="${p.href}" style="--dx:${f(nx*5)}px;--dy:${f(ny*5)}px;--i:${i+1}" aria-label="${p.href==='#find'?'검색 — 기관 이름이나 하고 싶은 일로 검색해 보세요':p.l.join(' ')}">${glow}<path class="seg" d="${d}" fill="url(#pg${i})" stroke="url(#pg${i})" stroke-width="${round*2}"/>${t}</a>`;
  });
  const hex='M'+V.map(v=>v.map(n=>f(n*0.94)).join(' ')).join('L')+'Z';
  g1+=`<a class="pt ctr-a" href="#guide" aria-label="졸업 후 우리 아이는? — 한눈에 보는 졸업 후 갈 수 있는 곳"><path class="seg" d="${hex}" fill="url(#gc)" stroke="url(#gc)" stroke-width="18"/>
    <path d="${hex}" fill="url(#gl)" transform="scale(.82)" opacity=".6" pointer-events="none"/>
    <text class="ctr2" x="0" y="-34">졸업 후</text>
    <text class="ctr" x="0" y="4">우리 아이는?</text>
    <g class="ctr-go"><rect x="-58" y="30" width="116" height="28" rx="14"/><text class="ctr3" x="0" y="44.5">한눈에 보기 →</text></g></a>`;
  return `<svg class="star" viewBox="-292 -322 584 644" role="navigation" aria-label="진로·진학정보 전체 도표"><defs>${defs}
    <radialGradient id="gc" cx=".38" cy=".28" r=".85"><stop offset="0" stop-color="#43c35a"/><stop offset=".55" stop-color="#1f9e3b"/><stop offset="1" stop-color="#0d5326"/></radialGradient>
    <radialGradient id="gl" cx=".35" cy=".2" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1d4a2c" flood-opacity=".16"/></filter>
    <filter id="nglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter></defs>
    <g filter="url(#sh)">${g1}</g></svg>`;
}

function mapBlock(scope, sel, count, groups){
  const M=window.MAPDATA; if(!M) return '';
  const [bx0,by0,bx1,by1]=M.bbox, x0=bx0-6, y0=by0-6, w=bx1-bx0+16, h=by1-by0+16;

  });

const SYN=[
  ['미술','그림','화가','미술관','아트','디자인','공예'],
  ['합창','노래','음악','공연','문화예술','악기'],

  ['돌봄','긴급돌봄','주간활동','방과후','주간보호','주간이용'],
  ['대학','전공과','평생교육','진학']
];
const TAGS=[[/위밀리|WE:MILY/,'위밀리 wemily'],[/장애인복지관/,'수영 체육 운동 스포츠 탁구 프로그램'],[/동백휴먼미르/,'수영 수영장 체육 운동 스포츠'],[/휴먼미르/,'휴먼미르 주간보호']];
function tagsOf(n){ return TAGS.filter(([r])=>r.test(n)).map(([,t])=>t).join(' '); }
function terms(t){ const out=new Set([t]); SYN.forEach(g=>{ if(g.some(w=>w===t||t.includes(w)||w.includes(t)&&t.length>=2)) g.forEach(w=>out.add(w)); }); return [...out]; }
function updateFind(){
  const {q,gu}=findState;
  const t=q.replace(/구$/,'').trim();
  const T=t?terms(t):[];
  const hit=txt=>!t||T.some(w=>txt.includes(w));
  const hits = ALL.filter(h=>(!gu||h.x[2]===gu) && hit(h.x[0]+' '+h.x[1]+' '+h.b.title+' '+GU[h.x[2]]+' '+(h.x[4]||'')+' '+tagsOf(h.x[0])));
  const groups=new Map();
  hits.forEach(h=>{ if(!groups.has(h.b)) groups.set(h.b,{s:h.s,b:h.b,items:[]}); groups.get(h.b).items.push(h.x); });
  let info=[];
  if(t){ S.forEach(s=>s.blocks.forEach(b=>{ if(b.type==='places') return;
      const txt=strip(JSON.stringify([b.title,b.org,b.items,b.rows,b.groups,b.root])).replace(/[\[\]",]+/g,' ').replace(/\b(null|bldg|tool|shop|bag|art|home|book|heart|cap|cy|find|siseol|bokji|hullyeon|chwieop|jinhak|local|gg-res|rehab|univ|dtc-map)\b/g,' ').replace(/(^|\s)\d{1,2}(?=\s)/g,' ').replace(/\s+/g,' ');
      const w=T.find(w=>txt.includes(w)); if(!w) return;
      const k=txt.indexOf(w); const snip=(k>18?'…':'')+txt.slice(Math.max(0,k-18),k+w.length+22).trim()+'…';
      info.push({s,b,snip,w}); })); }
  $('#mapbox').innerHTML = mapBlock('find', gu, `${gu?GU[gu]:'용인시 전체'}${t?` · ‘${esc(q)}’`:''} — 기관 ${hits.length}곳`, (()=>{const m=new Map();(t?hits:ALL).forEach(h=>{if(!m.has(h.b))m.set(h.b,{b:h.b,items:[]});m.get(h.b).items.push(h.x);});return [...m.values()];})());
  let html='';
  if(t) html+=`<p class="rsum">‘${esc(q)}’ 검색 결과: 안내 ${info.length}건, 기관 ${hits.length}곳${T.length>1?`<small>비슷한 말도 함께 찾았어요: ${T.filter(w=>w!==t).slice(0,6).join(', ')}</small>`:''}</p>`;
  if(info.length) html+=`<section><h4>안내 ${info.length}건</h4><ul class="info-hits">${info.map(({s,b,snip,w})=>`<li><a href="#${s.id}" data-jump="${b.id}" data-hl="${esc(w)}"><small>${s.title}</small>${b.title||strip(b.org).replace(/\[기관명: |\]/g,'')} →<span class="snip">${esc(snip).replace(esc(w),`<mark>${esc(w)}</mark>`)}</span></a></li>`).join('')}</ul></section>`;
  html+=placeGroups([...groups.values()], true);
  if(t && !info.length && !hits.length) html+=`<p class="empty">‘${esc(q)}’에 맞는 내용이 없어요. 다른 낱말로 찾거나 아래 지도에서 구를 눌러 보세요.</p>`;
  if(t){ $('#rtop').innerHTML=html; $('#results').innerHTML=''; }
  else { $('#rtop').innerHTML=''; $('#results').innerHTML=html; }
}

/* ---------- 이동 ---------- */
let pendingJump=null, pendingHL=null;
function route(){
  const id=location.hash.slice(1)||'home';
  const s=S.find(x=>x.id===id);
  $('#bar').hidden = id==='home';
  $('#appfoot').hidden = id==='home';
  $('#homeBtn').hidden = id==='star';
  $('#findBtn').hidden = id==='find';
  if(s){ section(s,pendingJump); if(pendingHL){ const jj=pendingJump, hh=pendingHL; setTimeout(()=>flashHL(jj,hh),350); } }
  else if(id==='find') find();
  else if(id==='guide') guide();
  else if(id==='star') starPage();
  else if(id==='test') testPage();
  else { home(); scrollTo(0,0); }
  pendingJump=null; pendingHL=null;
}
document.addEventListener('click', e=>{
  const j=e.target.closest('[data-jump]');
  if(j){ const tgt=j.getAttribute('href').slice(1);
    if(location.hash.slice(1)===tgt){ e.preventDefault(); document.getElementById(j.dataset.jump)?.scrollIntoView({behavior:'smooth'}); if(j.dataset.hl) setTimeout(()=>flashHL(j.dataset.jump,j.dataset.hl),400); }
    else { pendingJump=j.dataset.jump; pendingHL=j.dataset.hl||null; } return; }
  const gb=e.target.closest('.gu-btns button');
  if(gb){ setGu(gb.parentElement.dataset.scope, gb.dataset.gu); return; }
  const kd=e.target.closest('.kd'); if(kd){ showK(+kd.dataset.k); return; }
  if(e.target.closest('.kx')){ document.getElementById('kpop').hidden=true; document.querySelectorAll('.kd').forEach(g=>g.classList.remove('sel')); return; }
  const kli=e.target.closest('.klist li'); if(kli && !e.target.closest('a')){ showK(+kli.dataset.k); document.querySelector('.kmap')?.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  const dot=e.target.closest('.gmap .dot');
  if(dot){ const svg=dot.closest('.gmap'), scope=svg.dataset.scope, name=dot.dataset.name, dg=dot.dataset.gu;
    if(lastPointer!=='mouse' && svg.dataset.hover!==dg && (GUSTATE[scope]||'')!==dg){ svg.dataset.hover=dg; const hn=svg.parentElement.querySelector('.tap-hint'); if(hn) hn.textContent=`${GU[dg]}예요. 한 번 더 누르면 기관이 나와요.`; return; }
    if((GUSTATE[scope]||'')!==dot.dataset.gu) setGu(scope, dot.dataset.gu);
    const li=[...document.querySelectorAll('.pcards li')].find(l=>l.dataset.name===name&&l.dataset.cat===dot.dataset.cat)||[...document.querySelectorAll('.pcards li')].find(l=>l.dataset.name===name);
    if(li){ li.scrollIntoView({behavior:'smooth',block:'center'}); li.classList.remove('flash'); void li.offsetWidth; li.classList.add('flash'); }
    return; }
  const pli=e.target.closest('.pcards li[data-pos]');
  if(pli && (e.target.closest('.onmap') || !e.target.closest('a,button'))){ showOnMap(pli.dataset.name, pli.dataset.cat); return; }
  const shp=e.target.closest('.gmap .gu-shape, .gmap .gu-lb');
  if(shp){ const svg=shp.closest('.gmap'), scope=svg.dataset.scope;
    const g=shp.dataset.gu||[...svg.querySelectorAll('.gu-shape')].find(p=>p.classList.contains([...shp.classList].find(c=>c!=='gu-lb')))?.dataset.gu;
    if(!g) return;
    if(lastPointer!=='mouse' && svg.dataset.hover!==g){ svg.dataset.hover=g; const hn=svg.parentElement.querySelector('.tap-hint'); if(hn) hn.textContent=`${GU[g]}예요. 한 번 더 누르면 기관이 나와요.`; return; }
    setGu(scope, g); return; }
  const sq=e.target.closest('[data-q]');
  if(sq){ findState.q=sq.dataset.q; $('#q').value=sq.dataset.q; updateFind(); return; }
  const c=e.target.closest('.cp');
  if(c){ const ok=()=>{c.textContent='복사됨';c.classList.add('ok');setTimeout(()=>{c.textContent='복사';c.classList.remove('ok');},1500);};
    const fb=()=>{const a=c.previousElementSibling;const r=document.createRange();r.selectNodeContents(a);const s=getSelection();s.removeAllRanges();s.addRange(r);};
    try{navigator.clipboard.writeText(c.dataset.copy).then(ok,fb);}catch(_){fb();} return; }
  const f=e.target.closest('.flt[data-for] button');
  if(f){ const w=f.parentElement,a=f.dataset.a;
    w.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===f));
    document.querySelectorAll(`#t-${w.dataset.for} tbody tr`).forEach(tr=>tr.hidden=!!a&&tr.dataset.a!==a); }
});
function flashHL(id,hl){
  const box=document.getElementById(id==='local'?'local':id); if(!box) return;
  const els=[...box.querySelectorAll('tr, .pcards li, .cmp > div, .pg, .note li li, .note > ul > li, .jt-card li, .org-b li')].filter(e=>e.textContent.includes(hl));
  const t=els[0]; if(!t) return;
  t.scrollIntoView({behavior:'smooth',block:'center'});
  els.slice(0,6).forEach(e=>{ e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); });
}
let lastPointer='mouse';
document.addEventListener('pointerdown',e=>{lastPointer=e.pointerType||'mouse';},true);
document.addEventListener('keydown',e=>{ const kd=e.target.closest&&e.target.closest('.kd'); if(kd&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); showK(+kd.dataset.k);} });
document.addEventListener('touchstart',()=>{lastPointer='touch';},{capture:true,passive:true});
document.addEventListener('pointerover',e=>{ if(e.pointerType!=='mouse') return; const p=e.target.closest('.gmap .gu-shape'); const svg=e.target.closest('.gmap'); if(svg) svg.dataset.hover=p?p.dataset.gu:''; });
document.addEventListener('pointerout',e=>{ if(e.pointerType!=='mouse') return; const svg=e.target.closest('.gmap'); if(svg && !svg.contains(e.relatedTarget)) svg.dataset.hover=''; });
addEventListener('hashchange',route);
route();
</script>
